<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>변명 차단기 3000</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-4xl w-full grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <div class="md:col-span-2 bg-gray-800 rounded-2xl shadow-2xl p-6 border border-red-500/30 flex flex-col justify-between">
            <div>
                <div class="text-center mb-6">
                    <span class="text-xs bg-red-600 text-white font-bold px-3 py-1 rounded-full uppercase tracking-wider animate-pulse">System Active</span>
                    <h1 class="text-3xl font-extrabold mt-2 text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-orange-400">변명 차단기 3000</h1>
                    <p class="text-gray-400 text-sm mt-1">오늘 운동을 안 하려는 당신의 변명은?</p>
                </div>

                <div class="space-y-4">
                    <textarea id="excuseInput" rows="3" class="w-full bg-gray-700 border border-gray-600 rounded-xl p-3 text-white placeholder-gray-400 focus:outline-none focus:border-red-500 transition" placeholder="예: 오늘 비가 와서 나가기 귀찮아, 너무 피곤해..."></textarea>
                    <button id="submitBtn" onclick="blockExcuse()" class="w-full bg-gradient-to-r from-red-600 to-orange-500 hover:from-red-500 hover:to-orange-400 text-white font-bold py-3.5 rounded-xl shadow-lg transform active:scale-95 transition duration-150">
                        변명 파괴하기
                    </button>
                </div>

                <div id="resultArea" class="mt-6 pt-6 border-t border-gray-700 hidden">
                    <h2 class="text-lg font-bold text-red-400 mb-2">🚨 AI 호랑이 관장의 팩트 폭격</h2>
                    <div id="aiResponse" class="bg-gray-950 p-4 rounded-xl text-gray-200 border-l-4 border-red-500 whitespace-pre-line leading-relaxed mb-4"></div>
                    
                    <div class="bg-gradient-to-br from-gray-900 to-gray-950 border border-orange-500/30 p-4 rounded-xl">
                        <span class="text-xs font-bold bg-orange-600 text-white px-2 py-0.5 rounded">🔥 오늘 당장 해야할 미션</span>
                        <div id="missionText" class="text-lg font-bold text-orange-400 mt-2 mb-4"></div>
                        
                        <div class="flex flex-col sm:flex-row gap-2">
                            <input id="nicknameInput" type="text" placeholder="닉네임 입력" class="bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-orange-500 sm:w-1/3">
                            <button id="clearBtn" onclick="clearMission()" class="flex-1 bg-orange-500 hover:bg-orange-400 text-gray-950 font-extrabold py-2 px-4 rounded-lg transition text-sm">
                                🏋️‍♂️ 미션 완료! (명예의 전당 등록)
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-gray-800 rounded-2xl shadow-2xl p-6 border border-orange-500/20 flex flex-col">
            <h2 class="text-xl font-bold text-orange-400 mb-4 flex items-center gap-2">
                🏆 명예의 전당 <span class="text-xs bg-gray-700 text-gray-300 px-2 py-0.5 rounded font-normal">최근 5명</span>
            </h2>
            <div class="flex-1">
                <ul id="rankingBoard" class="space-y-2 text-sm">
                    <li class="text-gray-500 text-center py-8">아직 미션을 완료한 영웅이 없습니다.</li>
                </ul>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ⚠️ STEP 3: 본인의 Firebase 설정값으로 반드시 교체하세요!
        const firebaseConfig = {
            apiKey: "AIzaSyCPRgy3ODaWkAOyiGRpuNSH5FncfyQYGZg",
            authDomain: "excuse-blocker-3000.firebaseapp.com",
            projectId: "excuse-blocker-3000",
            storageBucket: "excuse-blocker-3000.firebasestorage.app",
            messagingSenderId: "769461272500",
            appId: "1:769461272500:web:1a19a7459f752993757ce1"
        };

        // Firebase 초기화
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 가상의 팩트폭격 및 미션 데이터 (로컬 배열)
        const responses = [
            { reply: "비가 오면 헬스장이 무너지냐? 정신 상태가 무너진 거다! ⚡", mission: "방구석에서 제자리 걷기 하이레그 50회 실시!" },
            { reply: "과제할 체력은 있고 네 몸 지킬 체력은 없냐? 핑계 대지 마라!", mission: "의자에서 일어나 스쿼트 20회 실시!" },
            { reply: "피곤할수록 몸을 움직여야 혈액순환이 된다! 지금 당장 누워라.", mission: "누운 자리에서 레그 레이즈 15회 실시!" },
            { reply: "내일부터 하면 내일도 안 한다. 오늘 딱 3분만 움직여라! 🔥", mission: "지옥의 플랭크 1분 버티기 시작!" },
            { reply: "유튜브 볼 시간 10분은 있고 운동할 시간 3분은 없나보지? 😤", mission: "숨 가쁘게 암워킹(Walk-out) 10회 실시!" }
        ];

        let currentMission = "";

        // [기능 1] 변명 분석 및 파괴
        window.blockExcuse = async function() {
            const excuse = document.getElementById('excuseInput').value.trim();
            if (!excuse) return alert('변명을 입력해야 정신을 차립니다!');

            const btn = document.getElementById('submitBtn');
            const resultArea = document.getElementById('resultArea');
            
            btn.disabled = true;
            btn.innerText = "변명 분석 중... 🤖";

            try {
                // 1. 입력된 변명을 먼저 Firestore 'excuses' 컬렉션에 저장 (데이터 축적)
                await addDoc(collection(db, "excuses"), {
                    content: excuse,
                    timestamp: serverTimestamp()
                });

                // 2. 가상의 호랑이 관장 답변 매칭
                const randomIdx = Math.floor(Math.random() * responses.length);
                const selected = responses[randomIdx];
                
                document.getElementById('aiResponse').innerText = selected.reply;
                document.getElementById('missionText').innerText = selected.mission;
                currentMission = selected.mission; // 현재 미션 기억하기

                resultArea.classList.remove('hidden');
            } catch (e) {
                console.error("Error: ", e);
                alert("데이터 저장 실패! Firebase가 닫혀있거나 연결 오류입니다.");
            } finally {
                btn.disabled = false;
                btn.innerText = "변명 파괴하기";
            }
        }

        // [기능 2] 미션 완료 처리 및 명예의 전당 등록
        window.clearMission = async function() {
            const nickname = document.getElementById('nicknameInput').value.trim();
            if (!nickname) return alert('명예의 전당에 올릴 닉네임을 입력하세요!');

            const clearBtn = document.getElementById('clearBtn');
            clearBtn.disabled = true;
            clearBtn.innerText = "등록 중...";

            try {
                // Firestore 'cleared_missions' 컬렉션에 유저 점수 및 완료 정보 저장
                await addDoc(collection(db, "cleared_missions"), {
                    nickname: nickname,
                    mission: currentMission,
                    timestamp: serverTimestamp()
                });

                alert('🔥 명예의 전당 등록 완료! 오늘 하루도 해내셨습니다.');
                document.getElementById('nicknameInput').value = ""; // 입력창 비우기
            } catch (e) {
                console.error("Error: ", e);
                alert("명예의 전당 등록 실패!");
            } finally {
                clearBtn.disabled = false;
                clearBtn.innerText = "🏋️‍♂️ 미션 완료! (명예의 전당 등록)";
            }
        }

        // [기능 3] 실시간 랭킹 보드 업데이트 (onSnapshot으로 실시간 갱신 구현)
        const q = query(collection(db, "cleared_missions"), orderBy("timestamp", "desc"), limit(5));
        onSnapshot(q, (querySnapshot) => {
            const rankingBoard = document.getElementById('rankingBoard');
            rankingBoard.innerHTML = ""; // 기존 목록 비우기

            if (querySnapshot.empty) {
                rankingBoard.innerHTML = `<li class="text-gray-500 text-center py-8">아직 미션을 완료한 영웅이 없습니다.</li>`;
                return;
            }

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const li = document.createElement('li');
                li.className = "bg-gray-700/50 p-3 rounded-lg border border-gray-600/50 flex justify-between items-center animate-fadeIn";
                li.innerHTML = `
                    <div>
                        <span class="font-bold text-orange-400">⚡ ${data.nickname || '익명'}</span>
                        <p class="text-xs text-gray-400 mt-0.5">${data.mission || '미션 완료'}</p>
                    </div>
                    <span class="text-[10px] bg-green-900/50 text-green-400 px-2 py-1 rounded font-bold">SUCCESS</span>
                `;
                rankingBoard.appendChild(li);
            });
        });
    </script>
</body>
</html>
